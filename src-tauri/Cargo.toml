[package]
name = "kz-client"
version = "1.0.0"
description = "KZ Client — launcher Minecraft premium"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kz_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "stream", "gzip"] }
futures = "0.3"
thiserror = "2"
anyhow = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = "0.33"
discord-rich-presence = "0.2"
open = "5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
